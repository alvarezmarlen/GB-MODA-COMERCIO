version: '3.8'

services:
  # ==========================================
  # 1. SERVICIO BACKEND (FLASK + SQLITE)
  # ==========================================
  backend:
    build: ./backend # <--- Cambia esto por el nombre de tu carpeta del backend
    container_name: contenedor_flask_back
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # PERSISTENCIA DE IMÁGENES:
      # Mapea la carpeta de subidas del contenedor a una carpeta local en tu PC
      - ./mis_imagenes_locales:/app/app/uploads

    # Mapeamos directamente los dos archivos individuales de tu computadora al contenedor.
      # De esta forma Docker los resguarda de forma independiente sin tocar tu código.
      - ./mi_bd_sqlite/moda_comercio.db:/app/app/moda_comercio.db
      - ./mi_bd_sqlite/database.db:/app/app/database.db
    environment:
      - FLASK_ENV=development

  # ==========================================
  # 2. SERVICIO FRONTEND
  # ==========================================
  frontend:
    build: ./frontend
    container_name: contenedor_front
    restart: always
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true # Se recomienda junto a stdin_open para asegurar que Vite no se quede colgado
    volumes:
      # Sincroniza tu carpeta de código local con la del contenedor para el Hot-Reload
      - ./frontend:/app
      # "Anonymous volume": Evita que Docker sobrescriba o borre tus node_modules internos
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend