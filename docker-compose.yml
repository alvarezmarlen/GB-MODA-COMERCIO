services:
  # ==========================================
  # 1. BACKEND SERVICE (FLASK + SQLITE)
  # ==========================================
  backend:
    build: ./backend
    container_name: contenedor_flask_back
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # PERSISTENCIA DE IMÁGENES:
      # Mapea la carpeta local mis_imagenes_locales dentro del contenedor.
      - ./mis_imagenes_locales:/app/mis_imagenes_locales

      # Mapeamos directamente la carpeta de la base de datos al contenedor.
      # La app usará /app/mi_bd_sqlite/moda_comercio.db.
      - ./mi_bd_sqlite:/app/mi_bd_sqlite
    environment:
      - FLASK_ENV=development

  # ==========================================
  # 2. FRONTEND SERVICE
  # ==========================================
  frontend:
    build: ./frontend
    container_name: contenedor_front
    restart: always
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true # Recommended with stdin_open to prevent Vite from hanging
    volumes:
      # Sync local source for hot-reload during development
      - ./frontend:/app
      # Anonymous volume prevents host node_modules from overriding container's
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend