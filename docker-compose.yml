version: '3.8'

services:
  # ==========================================
  # 1. BACKEND SERVICE (FLASK + SQLITE)
  # ==========================================
  backend:
    build: ./backend
    container_name: contenedor_flask_back
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Persist uploaded images to a local directory
      - ./mis_imagenes_locales:/app/app/uploads

      # Bind-mount SQLite DB files for data persistence
      - ./mi_bd_sqlite/moda_comercio.db:/app/app/moda_comercio.db
      - ./mi_bd_sqlite/database.db:/app/app/database.db
    environment:
      - FLASK_ENV=development

  # ==========================================
  # 2. FRONTEND SERVICE
  # ==========================================
  frontend:
    build: ./frontend
    container_name: contenedor_front
    restart: always
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true # Recommended with stdin_open to prevent Vite from hanging
    volumes:
      # Sync local source for hot-reload during development
      - ./frontend:/app
      # Anonymous volume prevents host node_modules from overriding container's
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend