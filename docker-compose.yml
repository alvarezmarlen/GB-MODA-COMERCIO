services:

  backend:
    build:
      context: ./backend

    container_name: moda_backend

    working_dir: /app

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - ./backend:/app
      - ./data:/data

    networks:
      - moda_network

    restart: unless-stopped

    init: true

    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend

    container_name: moda_frontend

    ports:
      - "8085:80"

    depends_on:
      backend:
        condition: service_healthy

    environment:
      - VITE_API_URL=http://localhost:5000

    networks:
      - moda_network

    restart: unless-stopped

    init: true

    mem_limit: 256m
    cpus: 0.5

networks:
  moda_network:
    driver: bridge