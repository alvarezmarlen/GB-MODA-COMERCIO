services:
  # ==========================================
  # 1. SERVICIO BACKEND (FLASK + SQLITE)
  # ==========================================
  backend:
    build: ./backend # <--- Cambia esto por el nombre de tu carpeta del backend
    container_name: contenedor_flask_back
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # PERSISTENCIA DE IMÁGENES:
      # Mapea la carpeta local mis_imagenes_locales dentro del contenedor.
      - ./mis_imagenes_locales:/app/mis_imagenes_locales

    # Mapeamos directamente la carpeta de la base de datos al contenedor.
    # La app usará /app/mi_bd_sqlite/moda_comercio.db.
      - ./mi_bd_sqlite:/app/mi_bd_sqlite
    environment:
      - FLASK_ENV=development

  # ==========================================
  # 2. SERVICIO FRONTEND
  # ==========================================
  frontend:
    build: ./frontend
    container_name: contenedor_front
    restart: always
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true # Se recomienda junto a stdin_open para asegurar que Vite no se quede colgado
    volumes:
      # Sincroniza tu carpeta de código local con la del contenedor para el Hot-Reload
      - ./frontend:/app
      # "Anonymous volume": Evita que Docker sobrescriba o borre tus node_modules internos
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend